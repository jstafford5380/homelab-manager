      l1: { ...base, ...wd, serial: "VK1AGG02", bay: "Bay 8", inst: null, unconfirmed: true, asleep: true, cost: 155, purchased: "Aug 2025", hours: "40 h", temp: "30 °C", status: "neutral", label: "Spare", notes: "Cold spare for tank",
            why: ["Spare:", "Installed but not in any pool, ready to swap in.", "neutral"] },
      b1: { ...base, ...exos, serial: "ZHZ0AB12", bay: "Bay 1", encl: 1, slot: 1, inst: 2020.8, cost: 230, purchased: "Oct 2020", hours: "52,900 h" },
      b2: { ...base, ...exos, serial: "ZHZ0AB77", bay: "Bay 2", encl: 1, slot: 2, inst: 2020.8, cost: 230, purchased: "Oct 2020", hours: "52,880 h" },
      p1: { ...base, nick: "Crucial MX500 500GB", raw: "CT500MX500SSD1", cap: "500 GB", kind: "SATA SSD", fw: "M3CR046", serial: "2219E5F1A2B3", bay: "SATA port 0", inst: 2022.9, cost: 52, purchased: "Nov 2022", hours: "26,100 h", temp: "35 °C", wear: "9% used" },
      p2: { ...base, nick: null, raw: "SSD 512GB", cap: "512 GB", kind: "SATA SSD", fw: "", serial: "AA000000000000001", bay: "SATA port 1", inst: null, noSmart: true, status: "neutral", label: "Unknown",
            why: ["Unknown:", "This drive doesn’t provide SMART data, so its health can’t be checked. Consider replacing it with a drive that does.", "neutral"] }
    };

    const ui = { scenario: "normal", server: "truenas", drive: null, editing: false, smart: true, saved: false };
    const app = document.getElementById("app");
    const icon = {
      check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
      chev: '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
      warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
      x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>'
    };
    const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const month = y => MONTHS[Math.min(11, Math.round((y % 1) * 12))] + " " + Math.floor(y);
    const age = y => { const m = Math.round(y * 12); return Math.floor(m / 12) + " y " + (m % 12) + " m"; };
    const pill = (tone, text) => `<span class="pill tone-${tone}">${text}</span>`;
    const narrow = () => app.clientWidth < 700;

    function serverOf() { return SERVERS.find(s => s.id === ui.server); }
    function view(id, server, poolName) {
      let d = { ...DRIVES[id], id };
      if (!ui.smart && d.noSmart) d = { ...d, status: "ok", label: "Healthy", why: null };
      const yrs = d.inst ? NOW - d.inst : null;
      const slot = server.enclosures && d.encl ? `Enclosure ${d.encl} · Slot ${d.slot}` : "";
      return { ...d, title: d.nick || d.raw, yrs, slot, pool: poolName,
        age: yrs === null ? "" : age(yrs),
        why: !ui.smart && d.whyOff ? ["Why “Watch”:", d.whyOff, "warn"] : d.why };
    }

    function tabs() {
      return `<nav class="tabs" aria-label="Servers">${SERVERS.map(s => {
        const ids = s.pools.flatMap(p => p.drives).concat(s.loose);
        const watch = ids.filter(i => ["warn", "bad"].includes(DRIVES[i].status)).length;
        const line = s.stale ? `Out of date · ${s.seen}` : `${ids.length} drives · ${watch ? watch + " to watch" : "all healthy"}`;
        return `<button class="tab" data-server="${s.id}" aria-pressed="${s.id === ui.server}"><span class="dot d-${s.fresh}" aria-hidden="true"></span><span><strong>${s.name}</strong><span class="line">${line}</span></span></button>`;
      }).join("")}</nav>`;
    }

    function driveRow(d) {
      const bayMark = d.unconfirmed ? `<span class="unconfirmed">Not confirmed</span>` : `<span class="confirm" title="You confirmed this location">${icon.check}Confirmed</span>`;
      const inService = d.age || `<button class="link" data-drive="${d.id}" data-edit="1">Add install date</button>`;
      return `<tr><td>${pill(d.status, d.label)}</td>
        <td><button class="drive-btn" data-drive="${d.id}" aria-label="Open details for ${d.title}, ${d.bay}">${d.title}</button><div class="line-xs">${d.kind}</div></td>
        <td style="font-variant-numeric: tabular-nums">${d.cap}</td><td class="mono">${d.serial}</td>
        <td><strong>${d.bay}</strong>${bayMark}${d.slot ? `<div class="line-xs">${d.slot}</div>` : ""}</td><td>${inService}</td></tr>`;
    }
    function driveCard(d) {
      return `<button class="dcard" data-drive="${d.id}"><strong>${d.title}</strong>${pill(d.status, d.label)}
        <span class="line-sm">${d.bay}${d.unconfirmed ? ' <span style="color: var(--tone-warn); font-weight: 600">(not confirmed)</span>' : ""} · ${d.cap} · ${d.serial}</span>
        <span class="line-sm">${d.age || '<span style="color: var(--primary); font-weight: 600">Add date</span>'}</span></button>`;
    }
    function driveList(drives) {
      return `<div class="tablewrap"><table><thead><tr><th scope="col" style="width:130px">Status</th><th scope="col">Drive</th><th scope="col">Capacity</th><th scope="col">Serial</th><th scope="col">Location</th><th scope="col">In service</th></tr></thead>
        <tbody>${drives.map(driveRow).join("")}</tbody></table></div><div class="cards">${drives.map(driveCard).join("")}</div>`;
    }
    function poolCard(p, s) {
      const status = !ui.smart && p.smartOnly ? { status: "ok", label: "Healthy", note: "" } : p;
      const max = Math.max(...p.datasets.map(x => x[2]));
      const drives = p.drives.map(i => view(i, s, p.name));
      return `<article class="pool"><div class="pool-head"><div class="meta">
          <div style="display:flex;align-items:center;gap:10px"><h3 style="font-size:17px">${p.name}</h3>${pill(status.status, status.label)}</div>
          <span class="line-sm">${p.layout}</span>
          <span style="font-size:13px;display:flex;align-items:center;gap:6px"><span class="dot d-${p.scrubDot}" aria-hidden="true"></span>${p.scrub}</span></div>
        <div class="usage"><div style="display:flex;justify-content:space-between;font-size:13px"><span><strong>${p.used}</strong> used of ${p.size}</span><span class="line-sm">${p.pct}% full</span></div>
          <div class="bar" role="img" aria-label="${p.pct} percent used"><span style="width:${p.pct}%"></span></div><span class="line-xs">${p.forecast}</span></div></div>
        ${status.note ? `<p class="note">${status.note}</p>` : ""}${driveList(drives)}
        <details class="space"><summary>${icon.chev}What’s using space</summary><ul>${p.datasets.map(([n, sz, v]) =>
          `<li style="display:grid;gap:4px"><div style="display:flex;justify-content:space-between;font-size:13px"><span class="mono">${n}</span><span>${sz}</span></div><div class="bar" role="img" aria-label="${n} uses ${sz}"><span style="width:${Math.max(2, Math.round(v / max * 100))}%;opacity:.7"></span></div></li>`).join("")}</ul></details></article>`;
    }
    function serverSection(s, lastLoaded) {
      const drives = s.pools.flatMap(p => p.drives.map(i => view(i, s, p.name))).concat(s.loose.map(i => view(i, s, null)));
      const attention = drives.filter(d => ["warn", "bad"].includes(d.status)).length;
      return `<section class="stack" aria-labelledby="server-title">
        <div class="server-head"><h2 id="server-title" style="font-size:22px;letter-spacing:-.4px">${s.name}</h2>${pill(s.fresh, s.freshLabel)}
          <span class="line-sm">${s.host} · last collected ${s.seen}</span>
          ${s.alerts.length ? `<details style="width:100%"><summary style="display:inline-flex">${pill("warn", icon.chev + s.alerts.length + " NAS alerts")}</summary>
            <ul style="margin:10px 0 0;padding:12px 16px;list-style:none;display:grid;gap:8px;border-radius:10px;background:var(--card);border:1px solid var(--border)">${s.alerts.map(a =>
              `<li style="display:grid;gap:1px"><strong style="font-size:13px">${a.title}</strong><span class="line-xs">${a.when} · reported by TrueNAS</span></li>`).join("")}</ul></details>` : ""}</div>
        ${s.stale ? `<div class="banner tone-warn" role="status">${icon.warn}<div><strong>Can’t reach this server right now.</strong> Everything below is from the last successful check, ${s.seen}. Drive status may have changed since.</div></div>` : ""}
        <dl class="facts"><div><dt>Pools</dt><dd>${s.pools.length}</dd></div><div><dt>Drives</dt><dd>${drives.length}</dd></div><div><dt>Raw capacity</dt><dd>${s.raw}</dd></div><div><dt>Needs a look</dt><dd>${s.stale ? "Unknown" : attention}</dd></div></dl>
        ${s.pools.map(p => poolCard(p, s)).join("")}
        ${s.loose.length ? `<article class="pool"><div class="pool-head"><div class="meta"><h3 style="font-size:17px">Not in a pool</h3><span class="line-sm">Spares, boot drives and anything unassigned</span></div></div>${driveList(s.loose.map(i => view(i, s, null)))}</article>` : ""}
      </section>`;
    }

    function health(d, s) {
      const zfs = { l: "ZFS errors", v: "0 · 0 · 0", sub: s.stale ? "Read · write · checksum, as of 2 days ago" : "Read · write · checksum", t: s.stale ? "neutral" : "ok" };
      const temp = { l: "Temperature", v: d.temp, sub: d.temp === "—" ? "No recent reading" : "Normal range", t: d.temp === "—" ? "neutral" : "ok" };
      if (!ui.smart) return [{ l: "Pool member", v: d.pool ? "Online" : "Not in a pool", sub: s.stale ? "As of 2 days ago" : "Reported by ZFS", t: s.stale || !d.pool ? "neutral" : "ok" }, zfs, temp];
      if (d.noSmart) return [{ l: "SMART", v: "Not provided", sub: "This drive doesn’t support it", t: "neutral" }, zfs, { l: "Powered on", v: "Unknown", t: "neutral" }, { l: "Temperature", v: "Unknown", t: "neutral" }];
      const old = s.stale || d.asleep;
      return [{ l: "SMART", v: old ? "Passed (2 days ago)" : "Passed", t: old ? "neutral" : "ok" },
        { l: "Powered on", v: d.hours, sub: (Math.round(parseInt(d.hours.replace(/\D/g, ""), 10) / 876) / 10) + " years", t: "neutral" }, temp,
        d.wear ? { l: "SSD wear", v: d.wear, sub: "Manufacturer rating", t: "ok" } : { l: "Pending sectors", v: String(d.pending || 0), sub: d.pending ? "Up from 0 this week" : "No change", t: d.pending ? "warn" : "ok" },
        { l: "Reallocated sectors", v: "0", sub: "No change", t: "ok" }, zfs];
    }
    function smartLine(d, s) {
      if (!ui.smart) return ["neutral", "From ZFS and TrueNAS. No SMART details yet."];
      if (d.noSmart) return ["neutral", "This drive doesn’t provide SMART data."];
      if (s.stale) return ["neutral", "Last SMART reading 2 days ago, before this server stopped reporting."];
      if (d.asleep) return ["neutral", "Asleep, so it was skipped to avoid waking it. Last SMART reading 2 days ago."];
      return ["ok", "SMART read 3 hours ago · last self-test passed 3 days ago"];
    }
    function panel(d, s, inline) {
      const [lineTone, line] = smartLine(d, s);
      const life = d.yrs === null ? null : Math.min(100, Math.round(d.yrs / PLAN * 100));
      const history = d.history || [[d.yrs === null ? "Oct 2026" : month(d.inst), d.yrs === null ? `First seen in ${d.bay}. Add an install date to track its age.` : `Installed in ${d.bay}`]];
      const trend = ui.smart && d.trend ? d.trend.map((v, i) => `${Math.round(i * 200 / (d.trend.length - 1))},${(40 - v / Math.max(...d.trend) * 34).toFixed(1)}`).join(" ") : null;
      const head = inline
        ? `<div class="panel-head" style="display:grid;gap:8px"><button class="link" data-close="1" style="display:inline-flex;align-items:center;gap:6px;min-height:44px">${icon.back}${s.name} · ${d.pool || "Not in a pool"}</button>`
        : `<div class="panel-head"><div style="flex:1;display:grid;gap:6px">`;
      return `<aside class="panel${inline ? " inline" : ""}" ${inline ? "" : 'role="dialog" aria-modal="true"'} aria-labelledby="drive-title">
        ${head}
          ${pill(d.status, d.label).replace('class="pill', 'style="justify-self:start" class="pill')}
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h2 id="drive-title" tabindex="-1" style="font-size:20px;letter-spacing:-.3px">${d.title}</h2><button class="link" style="font-size:13px">${d.nick ? "Rename" : "Give it a name"}</button></div>
          <span class="line-sm">${d.cap} · ${d.kind} · ${d.pool ? "in pool " + d.pool : "not in a pool"}</span>
          <span class="mono line-xs">Reported model: ${d.raw}</span>
        ${inline ? "</div>" : `</div><button class="btn outline" data-close="1" aria-label="Close drive details" style="width:40px;padding:0;justify-content:center">${icon.x}</button></div>`}
        <div class="panel-body">
          ${d.why ? `<div class="why tone-${d.why[2]}"><strong>${d.why[0]}</strong> ${d.why[1]}</div>` : ""}
          <section style="display:grid;gap:12px" aria-labelledby="h-health"><div style="display:grid;gap:2px"><h3 id="h-health">Health</h3>
            <span class="line-xs" style="display:flex;align-items:center;gap:6px"><span class="dot d-${lineTone}" aria-hidden="true"></span>${line}</span></div>
            <dl class="tiles">${health(d, s).map(h => `<div><dt>${h.l}</dt><dd><span class="dot d-${h.t}" aria-hidden="true"></span>${h.v}</dd>${h.sub ? `<dd class="sub">${h.sub}</dd>` : ""}</div>`).join("")}</dl>
            ${trend ? `<figure class="boxed" style="margin:0"><figcaption style="display:flex;justify-content:space-between;font-size:13px"><strong>Pending sectors</strong><span class="line-sm">last 8 weeks</span></figcaption>
              <svg viewBox="0 0 200 44" width="100%" height="56" preserveAspectRatio="none" role="img" aria-label="Pending sectors over 8 weeks: ${d.trend.join(", ")}" style="color:var(--tone-warn)"><line x1="0" y1="40" x2="200" y2="40" stroke="var(--border)"/><polyline points="${trend}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
              <div class="line-xs" style="display:flex;justify-content:space-between"><span>8 weeks ago: 0</span><span>Now: ${d.trend[d.trend.length - 1]}</span></div></figure>` : ""}
          </section>
          <section style="display:grid;gap:12px" aria-labelledby="h-where"><h3 id="h-where">Where it is</h3><dl class="kv">
            <dt>Location</dt><dd><strong>${d.bay}${d.slot ? " · " + d.slot : ""}</strong><div class="line-xs" style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center">${d.unconfirmed ? `<span>Not yet confirmed. Check the physical label before pulling this drive.</span><button class="link" style="font-size:12px">I’ve checked it’s here</button>` : "<span>You confirmed this location.</span>"}</div></dd>
            <dt>Serial</dt><dd class="mono">${d.serial}</dd><dt>Model</dt><dd class="mono">${d.raw}</dd>
            ${ui.smart && d.fw ? `<dt>Firmware</dt><dd>${d.fw}</dd>` : ""}</dl></section>
          <section style="display:grid;gap:12px" aria-labelledby="h-cost"><div style="display:flex;align-items:center;justify-content:space-between"><h3 id="h-cost">Cost &amp; lifespan</h3>${ui.editing ? "" : '<button class="link" data-startedit="1">Edit</button>'}</div>
            ${ui.saved ? '<p role="status" class="line-sm" style="color:var(--tone-ok);font-weight:600">Saved</p>' : ""}
            ${ui.editing ? `<form class="boxed" style="gap:14px;padding:16px" data-form="1"><div class="form-grid">
                <div class="field"><label for="f-cost">Price paid (USD)</label><input id="f-cost" inputmode="decimal" value="${d.cost || ""}" placeholder="e.g. 189"></div>
                <div class="field"><label for="f-p">Purchase date</label><input id="f-p" type="date"></div>
                <div class="field"><label for="f-i">Install date</label><input id="f-i" type="date"></div>
                <div class="field"><label for="f-w">Warranty ends</label><input id="f-w" type="date"></div></div>
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;min-height:32px"><input type="checkbox" ${d.estimated ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--primary)"> These dates are estimates</label>
                <div class="field"><label for="f-n">Notes</label><input id="f-n" value="${d.notes === "—" ? "" : d.notes}" placeholder="Where you bought it, RMA history…"></div>
                <div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn outline" data-canceledit="1">Cancel</button><button type="submit" class="btn">Save</button></div></form>`
              : `${life === null ? "" : `<div class="boxed"><div style="display:flex;justify-content:space-between;gap:12px;font-size:13px"><strong>Year ${Math.min(PLAN, Math.floor(d.yrs) + 1)} of ${PLAN}</strong><span class="line-sm">${d.yrs >= PLAN ? "Replacement due" : "Replace around " + month(d.inst + PLAN)}</span></div>
                  <div class="bar" role="img" aria-label="${life}% of planned service life used"><span style="width:${life}%"></span></div><span class="line-xs">Based on your ${PLAN}-year replacement plan, not a failure prediction.</span></div>`}
                <dl class="kv"><dt>Paid</dt><dd>${d.cost ? "$" + d.cost + (d.yrs ? " · about $" + Math.round(d.cost / Math.max(1, d.yrs)) + " per year so far" : "") : "Not recorded"}</dd>
                <dt>Purchased</dt><dd>${d.purchased || "Not recorded"}</dd>
                <dt>Installed</dt><dd>${d.yrs === null ? "Not recorded" : month(d.inst) + " · " + d.age + " ago" + (d.estimated ? " (estimated)" : "")}</dd>
                <dt>Warranty</dt><dd>${d.inst ? (d.inst + 3 < NOW ? "Ended " : "Until ") + month(d.inst + 3) : "Not recorded"}</dd><dt>Notes</dt><dd>${d.notes}</dd></dl>`}
            ${d.plan ? `<a href="#planning" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;padding:12px 14px;border-radius:10px;background:var(--muted);color:var(--foreground);text-decoration:none;font-size:13px;min-height:44px"><span><strong>Replacement planned</strong> · ${d.plan}</span><span style="color:var(--primary);font-weight:600">Open plan</span></a>` : ""}
          </section>
          <section style="display:grid;gap:12px" aria-labelledby="h-history"><div style="display:flex;align-items:center;justify-content:space-between"><h3 id="h-history">History</h3><button class="link">Add note</button></div>
            <ol class="history">${history.map(([w, t]) => `<li><span class="line-sm">${w}</span><span>${t}</span></li>`).join("")}</ol></section>
        </div>
        <div class="actions">${d.plan ? "" : '<button class="btn outline">Plan a replacement</button>'}<button class="btn outline">Mark as replaced</button>${ui.smart ? '<button class="btn outline">Import SMART report</button>' : ""}</div>
      </aside>`;
    }

    function pageHead() {
      return `<div class="page-head"><p class="eyebrow">HOMELAB CONTROL</p><h1 style="margin-top:6px">Storage</h1><p class="sub">Pools and drives, one server at a time.</p></div>`;
    }
    function render() {
      const sc = ui.scenario;
      let body;
      if (sc === "empty") {
        body = `<div class="card" style="align-items:center;text-align:center;padding:48px 24px;gap:14px"><h2>No servers yet</h2><p class="muted" style="font-size:14px;max-width:380px">Connect a NAS or server in Settings and its pools and drives will appear here.</p><a class="btn" href="#settings" style="text-decoration:none">Go to Settings</a></div>`;
      } else if (sc === "loading") {
        body = `<div role="status" aria-busy="true" aria-label="Loading storage" class="stack"><div class="tabs"><div class="skeleton" style="width:180px;height:52px"></div><div class="skeleton" style="width:180px;height:52px"></div></div>
          <div class="skeleton" style="width:240px;height:28px"></div><div class="facts"><div class="skeleton" style="height:70px;border:0"></div><div class="skeleton" style="height:70px;border:0"></div><div class="skeleton" style="height:70px;border:0"></div><div class="skeleton" style="height:70px;border:0"></div></div>
          <div class="skeleton" style="height:320px;border-radius:14px"></div></div>`;
      } else {
        const s = serverOf();
        const banner = sc === "unavailable" ? `<div class="banner tone-bad" role="status">${icon.warn}<div style="flex:1"><strong>Storage couldn’t be loaded.</strong> The control service didn’t respond. Showing what was loaded 12 minutes ago.</div><button class="btn outline sm">Retry</button></div>` : "";
        const d = ui.drive ? view(ui.drive, s, s.pools.find(p => p.drives.includes(ui.drive))?.name || null) : null;
        if (d && narrow()) body = banner + panel(d, s, true);
        else body = banner + tabs() + serverSection(s) + (d ? `<div class="scrim" data-close="1" aria-hidden="true"></div>` + panel(d, s, false) : "");
      }
      app.innerHTML = `<div class="stack" style="gap:28px">${app.querySelector && ui.drive && narrow() && !["empty", "loading"].includes(sc) ? "" : pageHead()}${body}</div>`;
      placeOverlay();
    }
    function placeOverlay() {
      const r = app.getBoundingClientRect(), top = document.querySelector(".mock-toolbar").offsetHeight;
      const right = window.innerWidth - r.right, w = Math.min(500, r.width);
      const scrim = app.querySelector(".scrim"), p = app.querySelector(".panel:not(.inline)");
      if (scrim) Object.assign(scrim.style, { top: top + "px", bottom: "0", left: r.left + "px", right: right + "px" });
      if (p) Object.assign(p.style, { top: top + "px", bottom: "0", right: right + "px", width: w + "px" });
    }

    let opener = null;
    app.addEventListener("click", e => {
      const t = e.target.closest("button, [data-close], a");
      if (!t) return;
      if (t.dataset.server) { ui.server = t.dataset.server; ui.drive = null; ui.editing = false; render(); return; }
      if (t.dataset.drive) { opener = t.dataset.drive; ui.drive = t.dataset.drive; ui.editing = !!t.dataset.edit; ui.saved = false; render(); app.querySelector("#drive-title")?.focus(); return; }
      if (t.dataset.close) { ui.drive = null; ui.editing = false; render(); app.querySelector(`[data-drive="${opener}"]`)?.focus(); return; }
      if (t.dataset.startedit) { ui.editing = true; ui.saved = false; render(); app.querySelector("#f-cost")?.focus(); return; }
      if (t.dataset.canceledit) { ui.editing = false; render(); return; }
      if (t.getAttribute("href")?.startsWith("#")) e.preventDefault();
    });
    app.addEventListener("submit", e => { e.preventDefault(); ui.editing = false; ui.saved = true; render(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.drive) { ui.drive = null; ui.editing = false; render(); app.querySelector(`[data-drive="${opener}"]`)?.focus(); } });
    window.addEventListener("resize", () => { placeOverlay(); });
    new ResizeObserver(() => { const wasNarrow = app.dataset.narrow === "1", now = narrow(); app.dataset.narrow = now ? "1" : "0"; if (ui.drive && wasNarrow !== now) render(); else placeOverlay(); }).observe(app);

    // Toolbar: state, width, theme and flag. Shareable URL, e.g. mock.html?state=stale&width=mobile&theme=dark&smart=off
    const params = new URLSearchParams(location.search);
    const sel = id => document.getElementById(id);
    const SERVER_FOR = { normal: "truenas", stale: "backup", partial: "proxmox", unavailable: "truenas" };
    function apply() {
      ui.scenario = sel("mock-state").value;
      if (SERVER_FOR[ui.scenario]) ui.server = SERVER_FOR[ui.scenario];
      ui.drive = null; ui.editing = false;
      ui.smart = sel("mock-smart").value === "on";
      document.documentElement.dataset.width = sel("mock-width").value;
      document.documentElement.dataset.theme = sel("mock-theme").value;
      try { history.replaceState(null, "", "?" + new URLSearchParams({ state: ui.scenario, width: sel("mock-width").value, theme: sel("mock-theme").value, smart: sel("mock-smart").value })); } catch { /* Opaque origins refuse URL changes. */ }
      requestAnimationFrame(render);
    }
    if (params.get("state")) sel("mock-state").value = params.get("state");
    sel("mock-width").value = params.get("width") || "desktop";
    sel("mock-theme").value = params.get("theme") === "dark" ? "dark" : "light";
    sel("mock-smart").value = params.get("smart") === "off" ? "off" : "on";
    ["mock-state", "mock-width", "mock-theme", "mock-smart"].forEach(id => sel(id).addEventListener("change", apply));
    apply();
  </script>
</body>
</html>
