  <script>
    const RANGES = [["24h", "24 h"], ["7d", "7 days"], ["30d", "30 days"], ["90d", "90 days"]];
    const RLONG = { "24h": "24-hour", "7d": "7-day", "30d": "30-day", "90d": "90-day" };
    const RSPAN = { "24h": "24 hours", "7d": "7 days", "30d": "30 days", "90d": "90 days" };
    const IDX = { "24h": 0, "7d": 1, "30d": 2, "90d": 3 };
    const DAYS = [1, 7, 30, 90];

        lines: [{ dot: "d-neutral", text: `Last reading ${last.d}: ${last.w || last.pw} W` }, { dot: "d-neutral", text: `About ${Math.round(pa * 24 * 30 / 1000)} kWh a month at this rate` }] };
    }
    function readingsInRange(sv) {
      const all = READINGS[sv.id];
      return all.length ? all.slice(all.length - READ_COUNT[IDX[ui.range]]) : [];
    }

    function readingMetrics(sv) {
      const P = PLATFORM[sv.platform], rs = readingsInRange(sv), n = rs.length, all = READINGS[sv.id], last = all[all.length - 1];
      const none = (key, label, text) => ({ key, label, measured: false, emptyTitle: "No readings", emptyText: text });
      if (!n) {
        const lastLine = what => last ? `None in the last ${RSPAN[ui.range]}. Last reading ${last.d}: ${what(last)}.` : "No readings yet. Add one from the server’s own dashboard.";
        return [none("cpu", "CPU use", lastLine(r => r.cpu + "%")), none("mem", "Memory", lastLine(r => gb(r.mem))), none("temp", P.tempLabel, "None of your readings include a temperature."), powerCard(sv)];
      }
      const from = n === 1 ? "From 1 reading" : `From ${n} readings`;
      const cpuV = rs.map(r => r.cpu), memV = rs.map(r => r.mem), memThr = sv.memGb * LEVEL.mem / 100;
      const cpuOver = cpuV.filter(v => v > LEVEL.cpu).length, memOver = memV.filter(v => v > memThr).length;
      return [
        { key: "cpu", label: "CPU use", measured: true, value: Math.round(avg(cpuV)) + "%", unit: "", caption: from + " · entered by you", dots: dotPath(cpuV, 0, 100), thrY: yOf(LEVEL.cpu, 0, 100),
          chart: `CPU use from ${n} entered readings, average ${Math.round(avg(cpuV))}%`, pill: cpuOver && cpuOver * 2 >= n ? ["Near its limit", "tone-info"] : null,
          lines: [{ dot: "d-neutral", text: `Highest reading ${Math.max(...cpuV)}%` }, cpuOver ? { dot: "d-info", text: `Above your ${LEVEL.cpu}% review level in ${cpuOver} of ${n} readings` } : { dot: "d-ok", text: `No reading above your ${LEVEL.cpu}% review level` }] },
        { key: "mem", label: "Memory", measured: true, value: pct(avg(memV), sv.memGb) + "%", unit: `${gb(avg(memV))} of ${sv.memGb} GB used`, caption: from + " · entered by you", dots: dotPath(memV, 0, sv.memGb), thrY: yOf(memThr, 0, sv.memGb),
          chart: `Memory used from ${n} entered readings, average ${pct(avg(memV), sv.memGb)}%`, pill: memOver && memOver * 2 >= n ? ["Near its limit", "tone-info"] : null,
          lines: [{ dot: "d-neutral", text: `Highest reading ${gb(Math.max(...memV))}` }, memOver ? { dot: "d-info", text: `Above your ${LEVEL.mem}% review level in ${memOver} of ${n} readings` } : { dot: "d-ok", text: `No reading above your ${LEVEL.mem}% review level` }] },
        { key: "temp", label: P.tempLabel, measured: false, emptyTitle: "Not in your readings", emptyText: "None of your readings for this period include a temperature. Add one next time if you can see it." },
        powerCard(sv)
      ];
    }

    // Components as shown: without collection nothing is detected and collection-based statuses fall back.
    function componentsFor(sv, hasMetrics, readingsOnly) {
      return COMPONENTS[sv.id].map(c => {
        if (!sv.auto) return { ...c, source: "You entered", match: "", why: c.whyManual || "", details: c.details.map(d => [d[0], d[1], "You entered"]),
          status: c.needsCollection && !c.metric ? "Not monitored" : c.status, tone: c.needsCollection && !c.metric ? "tone-neutral" : c.tone };
        if (c.metric && !hasMetrics && !readingsOnly) return { ...c, status: "Not monitored", tone: "tone-neutral", why: "" };
        return c;
      });
    }

    // ---------- render ----------
    const pill = (text, tone) => `<span class="pill ${tone}">${text}</span>`;
    const isMobile = () => document.documentElement.dataset.width === "mobile";
    const spark = (m, h) => `<svg class="spark" viewBox="0 0 240 56" preserveAspectRatio="none" role="img" aria-label="${m.chart}"${h ? ` style="height:${h}px"` : ""}><line class="base" x1="0" x2="240" y1="55" y2="55"/><line class="thr" x1="0" x2="240" y1="${m.thrY}" y2="${m.thrY}"/>${m.line ? `<path class="ln" d="${m.line}"/>` : ""}${m.dots ? `<path class="dots" d="${m.dots}"/>` : ""}</svg>`;

    function metricCard(m) {
      const top = `<div class="metric-top"><h3>${m.label}</h3>${m.pill ? pill(m.pill[0], m.pill[1]) : ""}</div>`;
      if (!m.measured) return `<article class="metric">${top}<p class="unmeasured">${m.emptyTitle}</p><div class="hatch" aria-hidden="true"></div><p class="line-sm">${m.emptyText}</p><button class="link" data-open="reading" style="min-height:32px">Add a reading</button></article>`;
      const s = m.split, split = s ? `<div class="membar" role="img" aria-label="Apps ${gb(s.apps)}, ${s.label} ${gb(s.cache)}, free ${gb(s.free)}"><span class="apps" style="width:${pct(s.apps, s.apps + s.cache + s.free)}%"></span><span class="cache" style="width:${pct(s.cache, s.apps + s.cache + s.free)}%"></span></div>
        <ul class="legend"><li><span class="sw apps" aria-hidden="true"></span>Apps ${gb(s.apps)}</li><li><span class="sw cache" aria-hidden="true"></span>${s.label} ${gb(s.cache)}</li><li><span class="sw free" aria-hidden="true"></span>Free ${gb(s.free)}</li></ul><p class="line-xs">${s.note}</p>` : "";
      return `<article class="metric">${top}<div class="big"><span class="num">${m.value}</span><span class="unit">${m.unit}</span></div><p class="line-xs">${m.caption}</p>${spark(m)}${split}
        <ul class="mlines">${m.lines.map(l => `<li><span class="dot ${l.dot}" aria-hidden="true"></span><span>${l.text}</span></li>`).join("")}</ul></article>`;
    }

    function componentsBlock(comps) {
      return `<div class="comp-card">${GROUPS.map(g => {
        const items = comps.filter(c => c.group === g);
        if (!items.length) return "";
        const src = c => `<span class="src${c.source === "You entered" ? "" : " det"}">${c.source}</span>`;
        return `<div class="group"><h3 class="group-h">${g}</h3>
          <div class="tablewrap"><table><thead><tr><th scope="col" style="width:160px">Status</th><th scope="col">Component</th><th scope="col">Details</th><th scope="col" style="width:150px">Source</th><th scope="col" style="width:110px">In service</th></tr></thead><tbody>
          ${items.map(c => `<tr><td>${pill(c.status, c.tone)}</td><td><button class="name-btn" data-comp="${c.id}">${c.name}</button><div class="line-xs">${c.kind}</div></td><td>${c.spec}</td><td>${src(c)}</td><td>${c.age}</td></tr>`).join("")}
          </tbody></table></div>
          <div class="cards">${items.map(c => `<button class="ccard" data-comp="${c.id}"><strong>${c.name}</strong>${pill(c.status, c.tone)}<span class="line-sm">${c.kind} · ${c.spec}</span>${src(c)}</button>`).join("")}</div></div>`;
      }).join("")}</div>`;
    }

    function panel(sv, c, metrics, inline) {
      const mm = c.metric ? metrics.find(m => m.key === c.metric) : null;
      // TrueNAS CPU temperature belongs to the processor; Synology's system temperature belongs to the unit.
      const tm = (c.metric === "cpu" && sv.platform === "truenas") || c.kind === "NAS unit" ? metrics.find(m => m.key === "temp") : null;
      const label = sv.auto && collects(sv) ? RLONG[ui.range] + " avg" : "avg of readings";
      const tiles = [];
      if (mm && mm.measured) tiles.push([mm.label + " · " + label, mm.value + (c.metric === "mem" && mm.split ? ` of ${sv.memGb} GB` : ""), mm.lines[0].text]);
      if (tm && tm.measured) tiles.push(["Temperature · " + label, tm.value, tm.lines[0].text]);
      if (mm && mm.split) tiles.push([mm.split.label + " · " + label, gb(mm.split.cache), "Given back when apps need it"]);
      const chartM = tm && tm.measured ? tm : mm && mm.measured ? mm : null;
      const note = c.runningNote || (mm && !mm.measured ? mm.emptyText : "") || (c.metric && !tiles.length ? "No readings yet. Add a reading to see how it’s running." : "");
      const head = inline
        ? `<div class="panel-head" style="display:grid;gap:6px"><button class="link" data-close="1" style="display:inline-flex;align-items:center;gap:6px;min-height:44px">${icon.back}${sv.name} · Components</button><p class="line-xs">${c.kind} · ${sv.name}</p><h2 id="comp-title" tabindex="-1">${c.name}</h2><p class="line-sm">${c.spec}</p><span>${pill(c.status, c.tone)}</span></div>`
        : `<div class="panel-head"><div class="grow"><p class="line-xs">${c.kind} · ${sv.name}</p><h2 id="comp-title" tabindex="-1">${c.name}</h2><p class="line-sm" style="margin-bottom:8px">${c.spec}</p>${pill(c.status, c.tone)}</div><button class="icon-btn" aria-label="Close" data-close="1">${icon.close}</button></div>`;
      const showWhy = c.why && !["Healthy", "Not monitored"].includes(c.status) && !c.status.startsWith("Last known");
      return `${inline ? "" : '<div class="scrim" aria-hidden="true"></div>'}<aside class="panel${inline ? " inline" : ""}" ${inline ? "" : 'role="dialog" aria-modal="true"'} aria-labelledby="comp-title">${head}
        <div class="panel-body">
          ${showWhy ? `<div class="why ${c.tone}"><strong>Why “${c.status}”:</strong> ${c.why}</div>` : ""}
          <section><h3>How it’s running</h3>
            ${tiles.length ? `<dl class="tiles">${tiles.map(t => `<div><dt>${t[0]}</dt><dd>${t[1]}</dd><dd class="tsub">${t[2]}</dd></div>`).join("")}</dl>` : ""}
            ${chartM ? `<figure style="margin:0;display:grid;gap:6px">${spark(chartM, 80)}<figcaption class="line-xs">${chartM.label}${sv.auto && collects(sv) ? ", last " + RSPAN[ui.range] : ", your readings"}. The dashed line is your review level.</figcaption></figure>` : ""}
            ${note ? `<p class="line-sm">${note}</p>` : ""}
          </section>
          ${c.slots ? `<section><h3>Memory slots</h3><div class="slots" role="img" aria-label="${c.slotLine}">${c.slots.map(s => `<div class="slot ${s[1] ? "filled" : "empty"}"><strong>${s[1] || "Empty"}</strong><span>${s[0]}</span></div>`).join("")}</div><p class="line-sm">${c.slotLine}</p><p class="line-sm">${c.slotPlan}</p></section>` : ""}
          <section><h3>Details</h3><dl class="kv">${c.details.map(d => `<dt>${d[0]}</dt><dd><span>${d[1]}</span><span class="src${d[2] === "Detected" ? " det" : ""}">${d[2]}</span></dd>`).join("")}</dl>${c.match ? `<p class="line-sm">${c.match}</p>` : ""}</section>
          <section><h3>Purchase</h3><dl class="kv"><dt>Price paid</dt><dd>${c.cost}</dd><dt>Installed</dt><dd>${c.installed}</dd><dt>Warranty</dt><dd>${c.warranty}</dd></dl></section>
          <section><h3>History</h3><ul class="history">${(c.history.length ? c.history : [["—", "Nothing recorded yet"]]).map(h => `<li><span class="line-xs">${h[0]}</span><span>${h[1]}</span></li>`).join("")}</ul><button class="link" style="min-height:44px">Add note</button></section>
        </div>
        <div class="actions"><button class="btn outline">Edit details</button><button class="btn outline">Plan an upgrade</button><button class="btn outline">Mark as replaced</button></div></aside>`;
    }

    function dialog(sv, kind, inline) {
      const wrap = (id, title, intro, body, save) => `${inline ? "" : '<div class="scrim" aria-hidden="true"></div>'}<section class="dialog${inline ? " inline" : ""}" role="dialog" aria-modal="${inline ? "false" : "true"}" aria-labelledby="${id}">
        <div class="panel-head"><div class="grow"><h2 id="${id}" tabindex="-1">${title}</h2><p class="line-sm">${intro}</p></div><button class="icon-btn" aria-label="Close" data-close="1">${icon.close}</button></div>
        <div class="panel-body">${body}</div><div class="actions"><button class="btn outline" data-close="1">Cancel</button><button class="btn">${save}</button></div></section>`;
      if (kind === "reading") return wrap("reading-title", `Add a reading for ${sv.name}`, "Copy these from the server’s own dashboard, a power meter or your UPS. Leave blank anything you didn’t measure.",
        `<div class="form-grid">
          <div class="field"><label for="r-when">Taken</label><input id="r-when" type="datetime-local" value="2026-11-01T18:30"></div>
          <div class="field"><fieldset><legend>What it shows</legend><label class="radio"><input type="radio" name="r-kind" checked>A moment in time</label><label class="radio"><input type="radio" name="r-kind">An average over a period</label></fieldset></div>
          <div class="field"><label for="r-cpu">CPU use</label><div class="suffix"><input id="r-cpu" type="number" value="22"><span>%</span></div></div>
          <div class="field"><label for="r-mem">Memory used</label><div class="suffix"><input id="r-mem" type="number" value="3.4"><span>GB of ${sv.memGb} GB</span></div></div>
          <div class="field"><label for="r-temp">Temperature</label><div class="suffix"><input id="r-temp" type="number" placeholder="Not measured"><span>°C</span></div></div>
          <div class="field"><label for="r-pw">Power draw</label><div class="suffix"><input id="r-pw" type="number" value="36"><span>W</span></div></div>
          <div class="field full"><label for="r-note">Note</label><textarea id="r-note">Power from the smart plug, after the nightly backup.</textarea></div>
        </div><p class="line-xs">Readings show as dots on the charts, apart from collected samples, and are labelled “entered by you” wherever they’re used.</p>`, "Save reading");
      return wrap("compadd-title", `Add a component to ${sv.name}`, "For parts the app can’t detect, like power supplies, coolers and cards. Detected parts appear on their own.",
        `<div class="form-grid">
          <div class="field"><label for="c-kind">Kind</label><select id="c-kind"><option>Power supply</option><option>Processor</option><option>Memory</option><option>Motherboard</option><option>Cooling</option><option>Storage controller</option><option>Network card</option><option>Graphics card</option><option>Case</option><option>NAS unit</option><option>Other</option></select></div>
          <div class="field"><label for="c-name">Name</label><input id="c-name" type="text" value="Seasonic Focus GX-650"></div>
          <div class="field"><label for="c-model">Model or part number</label><input id="c-model" type="text" value="SSR-650FX"></div>
          <div class="field"><label for="c-spec">Key specs</label><input id="c-spec" type="text" value="650 W · 80+ Gold"></div>
          <div class="field"><label for="c-price">Price paid (USD)</label><input id="c-price" type="number" value="109"></div>
          <div class="field"><label for="c-bought">Purchase date</label><input id="c-bought" type="month" value="2021-01"></div>
          <div class="field"><label for="c-installed">Install date</label><input id="c-installed" type="month" value="2021-01"></div>
          <div class="field"><label for="c-warranty">Warranty ends</label><input id="c-warranty" type="month" value="2031-01"></div>
          <label class="check field full"><input type="checkbox" checked>These dates are estimates</label>
          <div class="field full"><label for="c-notes">Notes</label><textarea id="c-notes"></textarea></div>
        </div>`, "Add component");
    }

    function render() {
      const sc = ui.scenario, app = document.getElementById("app");
      const header = `<header style="margin-bottom:24px"><p class="eyebrow">HOMELAB CONTROL</p><h1>Hardware</h1><p class="sub">Components and how they’re running, one server at a time.</p></header>`;
      if (sc === "empty") {
        app.innerHTML = header + `<section class="empty-card">${icon.chip}<h2>No servers yet</h2><p class="line-sm" style="font-size:14px">Connect a TrueNAS${ui.syn ? " or Synology" : ""} server in Settings and its processor, memory and board appear here.</p><a class="btn" href="#settings">Go to Settings</a></section>`;
        return;
      }
      if (sc === "loading") {
        app.innerHTML = header + `<div class="stack" role="status" aria-busy="true" aria-label="Loading hardware"><div class="tabs"><div class="skeleton" style="width:190px;height:56px"></div><div class="skeleton" style="width:190px;height:56px"></div></div><div class="skeleton" style="width:280px;height:30px"></div>
          <div class="facts"><div class="skeleton" style="height:72px"></div><div class="skeleton" style="height:72px"></div><div class="skeleton" style="height:72px"></div><div class="skeleton" style="height:72px"></div></div>
          <div class="metrics"><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div><div class="skeleton" style="height:220px"></div></div><div class="skeleton" style="height:320px"></div></div>`;
        return;
      }
      const list = servers();
      const sv = list.find(s => s.id === ui.server) || list[0];
      const P = PLATFORM[sv.platform];
      const hasMetrics = collects(sv);
      const collecting = sc === "collecting" && sv.id === "nas" && hasMetrics;
      const metrics = hasMetrics ? autoMetrics(sv, collecting) : readingMetrics(sv);
      const comps = componentsFor(sv, hasMetrics, READINGS[sv.id].length > 0);
      const failing = comps.filter(c => c.status === "Watch" || c.status === "Act now").length;
      const limit = comps.filter(c => c.status === "Near its limit").length;
      const i = IDX[ui.range];

      const tabLine = s => {
        if (s.stale) return "Out of date · 2 days ago";
        if (!s.auto) return "Entered by hand";
        const cs = componentsFor(s, collects(s), READINGS[s.id].length > 0);
        const f = cs.filter(c => c.status === "Watch").length, l = cs.filter(c => c.status === "Near its limit").length;
        return `${cs.length} components · ` + (f || l ? [f && f + " to watch", l && l + " near its limit"].filter(Boolean).join(" · ") : "nothing to look at");
      };

      let facts;
      if (hasMetrics) {
        const D = AUTO[sv.id];
        facts = collecting
          ? [[`CPU · ${RLONG[ui.range]} avg`, "Collecting", `Latest ${D.cpu.now}%`], ["Memory used by apps", "Collecting", `Latest ${gb(D.mem.now)} of ${sv.memGb} GB`], ["Uptime", sv.uptime, sv.uptimeSub], ["Needs a look", String(failing + limit), "Components"]]
          : [[`CPU · ${RLONG[ui.range]} avg`, D.cpu.avg[i] + "%", (sv.stale ? "Last known · " : "") + `Peak ${D.cpu.p95[i]}%`], ["Memory used by apps", gb(D.mem.apps[i]), (sv.stale ? "Last known · " : "") + `of ${sv.memGb} GB`], ["Uptime", sv.uptime, sv.uptimeSub], ["Needs a look", sv.stale ? "Unknown" : String(failing + limit), sv.stale ? "Server out of date" : "Components"]];
      } else {
        const n = readingsInRange(sv).length;
        facts = [["CPU · avg of readings", n ? metrics[0].value : "No readings", n ? "Entered by you" : `In the last ${RSPAN[ui.range]}`], ["Memory · avg of readings", n ? metrics[1].value : "No readings", n ? `of ${sv.memGb} GB` : `In the last ${RSPAN[ui.range]}`],
          sv.auto ? ["Uptime", sv.uptime, sv.uptimeSub] : ["Readings", String(n), `In the last ${RSPAN[ui.range]}`], ["Needs a look", sv.stale ? "Unknown" : String(failing + limit), sv.stale ? "Server out of date" : "Components"]];
      }
      let coverage;
      if (hasMetrics) coverage = collecting ? "Collecting since 6 hours ago · 72 five-minute samples so far." : AUTO[sv.id].coverage[i];
      else { const n = readingsInRange(sv).length; coverage = n ? `From ${n} reading${n > 1 ? "s" : ""} you entered. A few spot readings can miss busy and quiet periods.` : `No readings in the last ${RSPAN[ui.range]}.`; }

      const summary = `${comps.length} components · ${comps.filter(c => c.source !== "You entered").length} detected, ${comps.filter(c => c.source === "You entered").length} entered by you` + (failing ? ` · ${failing} to watch` : "") + (limit ? ` · ${limit} near its limit` : "");

      const banners = [
        sc === "unavailable" ? `<div class="banner tone-bad" role="status">${icon.warn}<div class="grow"><strong>Hardware couldn’t be loaded.</strong> The control service didn’t respond. Showing what was loaded 12 minutes ago.</div><button class="btn outline sm">Retry</button></div>` : "",
        sv.stale ? `<div class="banner tone-warn" role="status">${icon.warn}<div><strong>Can’t reach this server right now.</strong> Everything below is from the last successful check, 2 days ago. Averages stop at that point, and component status may have changed since.</div></div>` : "",
        !sv.auto ? `<div class="banner tone-info">${icon.info}<div><strong>This server isn’t connected, so its readings are entered by hand.</strong> Averages come only from the readings you add and can miss busy or quiet periods. <button class="link" data-open="reading">Add a reading</button> or <a href="#settings">connect it in Settings</a> to collect automatically.</div></div>` : "",
        collecting ? `<div class="banner tone-info" role="status">${icon.clock}<div><strong>Collecting since 6 hours ago.</strong> Each average appears once its whole range has been sampled: 24 hours tomorrow, 30 days in a month. Until then, cards show the latest sample.</div></div>` : ""
      ].join("");

      const content = `<div class="stack">
        ${banners}
        <nav class="tabs" aria-label="Servers">${list.map(s => `<button class="tab" data-server="${s.id}" aria-pressed="${s.id === sv.id}"><span class="dot ${s.fresh[2]}" aria-hidden="true"></span><span><strong>${s.name}</strong><span class="tline">${tabLine(s)}</span></span></button>`).join("")}</nav>
        <div class="server-head"><div class="grow"><div class="title-row"><h2>${sv.name}</h2>${pill(sv.fresh[0], sv.fresh[1])}${pill(sv.auto ? "Collected automatically" : "Entered by hand", "tone-info")}</div><p class="line-sm">${sv.host} · ${sv.platformLabel} · ${sv.seen}</p></div>
          <div class="row"><button class="btn outline" data-open="reading">${icon.plus}Add reading</button><button class="btn outline" data-open="component">${icon.plus}Add component</button></div></div>
        <dl class="facts">${facts.map(f => `<div><dt>${f[0]}</dt><dd>${f[1]}</dd><dd class="fsub">${f[2]}</dd></div>`).join("")}</dl>
        <section class="stack-sm" aria-labelledby="perf-h"><div class="section-row"><div><h2 id="perf-h">How it’s running</h2><p class="line-sm">${coverage}</p></div>
          <div class="seg" role="group" aria-label="Time range">${RANGES.map(r => `<button class="seg-btn" data-range="${r[0]}" aria-pressed="${r[0] === ui.range}">${r[1]}</button>`).join("")}</div></div>
          <div class="metrics">${metrics.map(metricCard).join("")}</div>
          <p class="line-xs">Review levels: CPU ${LEVEL.cpu}%, memory ${LEVEL.mem}%, temperature ${LEVEL.temp} °C. Dashed lines on the charts. <a href="#settings">Change in Settings</a></p></section>
        <section class="stack-sm" aria-labelledby="comp-h"><div><h2 id="comp-h">Components</h2><p class="line-sm">${summary}</p></div>${componentsBlock(comps)}</section>
      </div>`;

      const pc = ui.panel && comps.find(c => c.id === ui.panel);
      const overlay = pc ? panel(sv, pc, metrics, isMobile()) : ui.dialog ? dialog(sv, ui.dialog, isMobile()) : "";
      app.innerHTML = header + (overlay && isMobile() ? overlay : content + overlay);
    }

    // ---------- events ----------
    let returnFocus = null;
    document.getElementById("app").addEventListener("click", e => {
      const t = e.target.closest("[data-server],[data-range],[data-comp],[data-open],[data-close]");
      if (!t) return;
      if (t.dataset.server) { ui.server = t.dataset.server; ui.panel = null; ui.dialog = null; }
      if (t.dataset.range) ui.range = t.dataset.range;
      if (t.dataset.comp) { returnFocus = `[data-comp="${t.dataset.comp}"]`; ui.panel = t.dataset.comp; ui.dialog = null; }
      if (t.dataset.open) { returnFocus = `[data-open="${t.dataset.open}"]`; ui.dialog = t.dataset.open; ui.panel = null; }
      if (t.dataset.close) { ui.panel = null; ui.dialog = null; }
      render();
      if (t.dataset.comp || t.dataset.open) document.querySelector("#comp-title,#reading-title,#compadd-title")?.focus();
      else if (t.dataset.close && returnFocus) document.querySelector(returnFocus)?.focus();
      else if (t.dataset.server) document.querySelector(`[data-server="${ui.server}"]`)?.focus();
      else if (t.dataset.range) document.querySelector(`[data-range="${ui.range}"]`)?.focus();
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.panel || ui.dialog)) { ui.panel = null; ui.dialog = null; render(); if (returnFocus) document.querySelector(returnFocus)?.focus(); } });

    // Toolbar: state, width, theme and flags. Shareable URL, e.g. mock.html?state=synology&width=mobile&theme=dark&hwmetrics=off
    const sel = id => document.getElementById(id);
    const SCENARIO = {
      normal: { server: "nas" }, synology: { server: "ds920" }, manual: { server: "ds920" }, stale: { server: "backup" }, collecting: { server: "nas" },
      panel: { server: "nas", panel: "nas-cpu" }, reading: { server: "nas", dialog: "reading" }, component: { server: "nas", dialog: "component" },
      empty: {}, loading: {}, unavailable: { server: "nas" }
    };
    function apply() {
      ui.scenario = sel("mock-state").value;
      ui.hw = sel("mock-hwmetrics").value === "on";
      ui.syn = sel("mock-synology").value === "on";
      const s = SCENARIO[ui.scenario];
      ui.server = s.server && (ui.syn || s.server !== "ds920") ? s.server : "nas";
      ui.panel = s.panel || null; ui.dialog = s.dialog || null; ui.range = "30d";
      document.documentElement.dataset.width = sel("mock-width").value;
      document.documentElement.dataset.theme = sel("mock-theme").value;
      try { history.replaceState(null, "", "?" + new URLSearchParams({ state: ui.scenario, width: sel("mock-width").value, theme: sel("mock-theme").value, hwmetrics: sel("mock-hwmetrics").value, synology: sel("mock-synology").value })); } catch { /* Opaque origins refuse URL changes. */ }
      render();
    }
    const params = new URLSearchParams(location.search);
    if (SCENARIO[params.get("state")]) sel("mock-state").value = params.get("state");
    sel("mock-width").value = ["tablet", "mobile"].includes(params.get("width")) ? params.get("width") : "desktop";
    sel("mock-theme").value = params.get("theme") === "dark" ? "dark" : "light";
    sel("mock-hwmetrics").value = params.get("hwmetrics") === "off" ? "off" : "on";
    sel("mock-synology").value = params.get("synology") === "off" ? "off" : "on";
    ["mock-state", "mock-width", "mock-theme", "mock-hwmetrics", "mock-synology"].forEach(id => sel(id).addEventListener("change", apply));
    apply();
  </script>
</body>
</html>
