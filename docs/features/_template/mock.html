<!doctype html>
<!--
  Feature mock template. Copy this whole folder from docs/features/_template.

  - Design tokens are copied from src/Web/src/index.css (regenerate if that file changes).
  - Mock-only chrome (the toolbar) lives in .mock-toolbar. Everything inside #app is the design.
  - States: add an option to STATES below, then mark markup with data-state="name"
    (space-separated for several states). Unmarked markup shows in every state.
  - Responsive rules: use @container app (...) instead of @media so the Width switcher
    reflows the design. Implementation should map them back to the app's @media breakpoints.
  - Fixtures: keep inline copies in <script type="application/json" data-fixture="name">
    in sync with fixtures/name.json so this file stays self-contained.
-->
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NNN Feature name · Mock</title>
  <style>
    /* App tokens: light */
    :root {
      color-scheme: light;
      --background: #ffffff;
      --foreground: #1f2933;
      --card: #ffffff;
      --card-foreground: #1f2933;
      --popover: #ffffff;
      --popover-foreground: #1f2933;
      --primary: #24303d;
      --primary-foreground: #ffffff;
      --secondary: #eef1f4;
      --secondary-foreground: #2f3b48;
      --muted: #f1f3f5;
      --muted-foreground: #56616d;
      --accent: #eef1f4;
      --accent-foreground: #1f2933;
      --destructive: #a8392b;
      --border: #e1e5ea;
      --input: #7d8794;
      --ring: #3d5f86;
      --page: #f6f7f8;
      --surface-soft: #f3f5f7;
      --surface-stripe: #fafbfc;
      --text-secondary: var(--muted-foreground);
      --brand: #1f2933;
      --brand-background: #24303d;
      --brand-foreground: #ffffff;
      --nav-active: #e9edf1;
      --nav-active-foreground: #1f2933;
      --nav-count: #dde3e9;
      --error-background: #fff0ed;
      --error-border: #f3d1c7;
      --error-foreground: #9e4938;
      --warning-background: #fff6e8;
      --warning-border: #dfc9a0;
      --warning-foreground: #69471e;
      --chart-axis: #b9c1ca;
      --chart-point: #3d5f86;
      --tone-ok: #1e6b45;
      --tone-ok-bg: #e7f4ec;
      --tone-ok-border: #bcdcc8;
      --tone-warn: #7a4a0e;
      --tone-warn-bg: #fff4e0;
      --tone-warn-border: #e6c98f;
      --tone-bad: #a1301f;
      --tone-bad-bg: #fdece8;
      --tone-bad-border: #efc0b5;
      --tone-neutral: #56616d;
      --tone-neutral-bg: #f1f3f5;
      --tone-neutral-border: #8a95a1;
      --tone-info: #3f6487;
      --link: #3d5f86;
    }
    /* App tokens: dark */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #14181c;
      --foreground: #e6e9ed;
      --card: #1a1f24;
      --card-foreground: #e6e9ed;
      --popover: #1a1f24;
      --popover-foreground: #e6e9ed;
      --primary: #dfe5ec;
      --primary-foreground: #14181c;
      --secondary: #262d35;
      --secondary-foreground: #dfe5ec;
      --muted: #1f252b;
      --muted-foreground: #a7b0ba;
      --accent: #262d35;
      --accent-foreground: #e6e9ed;
      --destructive: #c0473a;
      --border: #353d46;
      --input: #7f8a96;
      --ring: #9dbad8;
      --page: #0f1215;
      --surface-soft: #1f252b;
      --surface-stripe: #1d2227;
      --brand: #e6e9ed;
      --brand-background: #dfe5ec;
      --brand-foreground: #14181c;
      --nav-active: #262d35;
      --nav-active-foreground: #ffffff;
      --nav-count: #333b45;
      --error-background: #38221e;
      --error-border: #a46b5f;
      --error-foreground: #ffc1b5;
      --warning-background: #34291b;
      --warning-border: #82683e;
      --warning-foreground: #f3d4a0;
      --chart-axis: #7f8a96;
      --chart-point: #9dbad8;
      --tone-ok: #8fd9b1;
      --tone-ok-bg: #142a20;
      --tone-ok-border: #2c5a43;
      --tone-warn: #f3cf92;
      --tone-warn-bg: #33281a;
      --tone-warn-border: #6e5531;
      --tone-bad: #ffb4a6;
      --tone-bad-bg: #3a201b;
      --tone-bad-border: #7a3f34;
      --tone-neutral: #a7b0ba;
      --tone-neutral-bg: #1f252b;
      --tone-neutral-border: #56606b;
      --tone-info: #9dbad8;
      --link: #9dbad8;
    }

    /* App base (mirrors src/Web/src/App.css) */
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--foreground); background: var(--page); font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 30px; letter-spacing: -1px; font-weight: 600; }
    h2 { font-size: 17px; font-weight: 600; }
    h3 { font-size: 15px; font-weight: 600; }
    small, .muted { color: var(--text-secondary); font-size: 12px; }
    a { color: var(--link); }
    .eyebrow { font-size: 11px; letter-spacing: 2px; font-weight: 600; color: var(--text-secondary); }
    .card { background: var(--card); color: var(--card-foreground); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 6px; font: inherit; font-weight: 500; cursor: pointer; border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground); }
    .btn.outline { background: var(--background); color: var(--foreground); border-color: var(--border); }
    .btn.sm { height: 32px; padding: 0 12px; }
    .btn:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .tone-ok { --tone: var(--tone-ok); --tone-bg: var(--tone-ok-bg); --tone-border: var(--tone-ok-border); }
    .tone-warn { --tone: var(--tone-warn); --tone-bg: var(--tone-warn-bg); --tone-border: var(--tone-warn-border); }
    .tone-bad { --tone: var(--tone-bad); --tone-bg: var(--tone-bad-bg); --tone-border: var(--tone-bad-border); }
    .tone-neutral { --tone: var(--tone-neutral); --tone-bg: var(--tone-neutral-bg); --tone-border: var(--tone-neutral-border); }
    .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--tone-border); background: var(--tone-bg); color: var(--tone); }

    /* Mock frame: the page area the design renders in */
    #app { container: app / inline-size; margin: 0 auto; padding: 36px 38px; max-width: 1600px; transition: max-width .2s; }
    html[data-width="tablet"] #app { max-width: 900px; }
    html[data-width="mobile"] #app { max-width: 390px; padding: 24px 16px; }
    html[data-width="tablet"] body, html[data-width="mobile"] body { background: var(--muted); }
    html[data-width="tablet"] #app, html[data-width="mobile"] #app { background: var(--page); min-height: calc(100vh - 49px); box-shadow: 0 0 0 1px var(--border); }

    /* Mock-only toolbar: not part of the design */
    .mock-toolbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; background: #1b1f1d; color: #e8ece9; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .mock-toolbar strong { margin-right: auto; }
    .mock-toolbar label { display: inline-flex; gap: 6px; align-items: center; }
    .mock-toolbar select { font: inherit; background: #2b312e; color: inherit; border: 1px solid #47504b; border-radius: 4px; padding: 3px 6px; }
    [data-state][hidden] { display: none !important; }

    /* Feature styles: put design-specific CSS below.
       For responsive rules use container queries so the Width switcher works:
       @container app (max-width: 700px) { ... }   (the app's mobile breakpoint)
       @container app (max-width: 1100px) { ... }  (the app's tablet breakpoint) */
  </style>
</head>
<body>
  <div class="mock-toolbar" role="region" aria-label="Mock controls (not part of the design)">
    <strong>MOCK · NNN Feature name</strong>
    <label>State <select id="mock-state"></select></label>
    <label>Width <select id="mock-width"><option value="desktop">Desktop</option><option value="tablet">Tablet 900</option><option value="mobile">Mobile 390</option></select></label>
    <label>Theme <select id="mock-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>

  <main id="app">
    <p class="eyebrow">HOMELAB CONTROL</p>
    <h1>Page heading</h1>
    <p class="muted" style="margin: 8px 0 30px">Supporting line.</p>

    <section class="card" data-state="normal">
      <div class="section-title"><h2>Section</h2><span class="pill tone-ok">Reporting</span></div>
      <p>Normal-state content. Replace with the design.</p>
    </section>
    <section class="card" data-state="empty"><h2>Nothing here yet</h2><p class="muted">Empty-state guidance.</p></section>
    <section class="card" data-state="loading"><p class="muted">Loading…</p></section>
    <section class="card" data-state="unavailable"><h2>Unavailable</h2><p class="muted">What failed and what still holds.</p><button class="btn outline sm">Retry</button></section>
    <section class="card" data-state="stale"><div class="section-title"><h2>Section</h2><span class="pill tone-warn">Out of date</span></div><p class="muted">Last-known data, clearly marked.</p></section>
  </main>

  <script type="application/json" data-fixture="normal">{}</script>

  <script>
    // States from the brief's state table. Keys must match data-state values.
    const STATES = { normal: "Normal", empty: "Empty", loading: "Loading", unavailable: "Unavailable / error", stale: "Stale or unknown" };
    // Parsed inline fixtures, for scripted mocks: FIXTURES.normal, ...
    const FIXTURES = Object.fromEntries([...document.querySelectorAll("[data-fixture]")].map(el => [el.dataset.fixture, JSON.parse(el.textContent)]));

    const params = new URLSearchParams(location.search);
    const stateSelect = document.getElementById("mock-state");
    const widthSelect = document.getElementById("mock-width");
    const themeSelect = document.getElementById("mock-theme");
    for (const [value, label] of Object.entries(STATES)) stateSelect.add(new Option(label, value));

    function apply() {
      const state = stateSelect.value;
      document.querySelectorAll("#app [data-state]").forEach(el => { el.hidden = !el.dataset.state.split(" ").includes(state); });
      document.documentElement.dataset.width = widthSelect.value;
      document.documentElement.dataset.theme = themeSelect.value;
      // Shareable URL, e.g. mock.html?state=stale&width=mobile&theme=dark
      try { history.replaceState(null, "", "?" + new URLSearchParams({ state, width: widthSelect.value, theme: themeSelect.value })); } catch { /* Opaque origins (data:, some file: viewers) refuse URL changes. */ }
    }
    stateSelect.value = STATES[params.get("state")] ? params.get("state") : "normal";
    widthSelect.value = params.get("width") || "desktop";
    themeSelect.value = params.get("theme") === "dark" ? "dark" : "light";
    [stateSelect, widthSelect, themeSelect].forEach(el => el.addEventListener("change", apply));
    apply();
  </script>
</body>
</html>
